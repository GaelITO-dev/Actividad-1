<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Verificador de Edad para Votar</title>
        <script src="js/ejercicio13.js" defer></script> 
    </head>
    <body>
        <main class="contenedor-formulario">
            <h1>Verificador de Edad</h1>
            <p class="subtitulo">Descubre si puedes votar</p>

            <form class="formulario" id="formulario-votar">
                <div class="grupo-formulario">
                    <label for="edad">Tu edad (años)</label>
                    <input type="text" id="edad" name="edad" inputmode="numeric" placeholder="Ej: 20" novalidate>
                </div>

                <button type="submit" class="boton-convertir">Verificar</button>

                <div class="grupo-formulario">
                    <label for="resultado">Resultado</label>
                    <input type="text" id="resultado" name="resultado" readonly aria-describedby="mensaje">
                </div>

                <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
            </form>
        </main>
    </body>
</html>
